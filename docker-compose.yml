version: '3.9'

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: uevio-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: uevio
      POSTGRES_PASSWORD: uevio_dev_password
      POSTGRES_DB: uevio_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uevio -d uevio_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: uevio-redis-dev
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:
  redis_dev_data:
