version: '3.9'

# Production on srv988590 (194.164.151.202)
# Nginx on VPS handles SSL + reverse proxy → 127.0.0.1:1300x
# Same setup as all other websites on this VPS.

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: uevio-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - /srv/uevio/backups:/backups
    networks:
      - uevio-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G

  redis:
    image: redis:7-alpine
    container_name: uevio-redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD} --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - uevio-internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/uevio-api:${IMAGE_TAG:-latest}
    container_name: uevio-api
    restart: always
    ports:
      - "127.0.0.1:13001:3001"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      API_PORT: 3001
      API_SECRET_KEY: ${API_SECRET_KEY}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
    networks:
      - uevio-internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  worker:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/uevio-worker:${IMAGE_TAG:-latest}
    container_name: uevio-worker
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
    networks:
      - uevio-internal
    depends_on:
      - api
    deploy:
      resources:
        limits:
          memory: 256M

  web:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/uevio-web:${IMAGE_TAG:-latest}
    container_name: uevio-web
    restart: always
    ports:
      - "127.0.0.1:13002:3002"
    environment:
      NODE_ENV: production
      NEXTAUTH_URL: ${NEXTAUTH_URL_WEB}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXT_PUBLIC_API_URL: ${API_URL}
      NEXT_PUBLIC_WEB_URL: ${NEXT_PUBLIC_WEB_URL}
    networks:
      - uevio-internal
    depends_on:
      - api
    deploy:
      resources:
        limits:
          memory: 512M

  business:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/uevio-business:${IMAGE_TAG:-latest}
    container_name: uevio-business
    restart: always
    ports:
      - "127.0.0.1:13003:3003"
    environment:
      NODE_ENV: production
      NEXTAUTH_URL: ${NEXTAUTH_URL_BUSINESS}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXT_PUBLIC_API_URL: ${API_URL}
    networks:
      - uevio-internal
    depends_on:
      - api
    deploy:
      resources:
        limits:
          memory: 512M

  admin:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/uevio-admin:${IMAGE_TAG:-latest}
    container_name: uevio-admin
    restart: always
    ports:
      - "127.0.0.1:13004:3004"
    environment:
      NODE_ENV: production
      NEXTAUTH_URL: ${NEXTAUTH_URL_ADMIN}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXT_PUBLIC_API_URL: ${API_URL}
    networks:
      - uevio-internal
    depends_on:
      - api
    deploy:
      resources:
        limits:
          memory: 512M

networks:
  uevio-internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
