# UEVIO — Nginx config for srv988590 (194.164.151.202)
# Place at: /etc/nginx/sites-available/uevio
# Enable:   ln -s /etc/nginx/sites-available/uevio /etc/nginx/sites-enabled/
#
# DNS required (all A records → 194.164.151.202):
#   uevio.com, www.uevio.com
#   api.uevio.com
#   business.uevio.com
#   admin.uevio.com

# ── uevio.com (public web) ────────────────────────────────────────────────────
server {
    listen 80;
    server_name uevio.com www.uevio.com;
    return 301 https://uevio.com$request_uri;
}

server {
    listen 443 ssl;
    server_name www.uevio.com;
    ssl_certificate     /etc/letsencrypt/live/uevio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uevio.com/privkey.pem;
    return 301 https://uevio.com$request_uri;
}

server {
    listen 443 ssl;
    server_name uevio.com;

    ssl_certificate     /etc/letsencrypt/live/uevio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uevio.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass         http://127.0.0.1:13002;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ── api.uevio.com ─────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name api.uevio.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.uevio.com;

    ssl_certificate     /etc/letsencrypt/live/api.uevio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.uevio.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50M;

    location / {
        proxy_pass         http://127.0.0.1:13001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

