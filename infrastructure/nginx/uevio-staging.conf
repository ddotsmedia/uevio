# ── admin.staging.uevio.com ───────────────────────────────────────────────────
server {
    listen 80;
    server_name admin.staging.uevio.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name admin.staging.uevio.com;

    ssl_certificate     /etc/letsencrypt/live/admin.staging.uevio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.staging.uevio.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Basic auth — protect staging admin
    auth_basic           "UEVIO Admin Staging";
    auth_basic_user_file /etc/nginx/.htpasswd-uevio-admin;

    location / {
        proxy_pass         http://127.0.0.1:13004;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
