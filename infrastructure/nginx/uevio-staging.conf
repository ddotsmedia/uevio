# UEVIO Staging — Nginx config for srv988590 (shared VPS)
# Place at: /etc/nginx/sites-available/uevio-staging
# Enable: ln -s /etc/nginx/sites-available/uevio-staging /etc/nginx/sites-enabled/
#
# Docker containers listen on 127.0.0.1:1300x (localhost only).
# Nginx handles SSL via Let's Encrypt (certbot) and proxies here.
#
# DNS required (all → 194.164.151.202):
#   staging.uevio.com
#   api.staging.uevio.com
#   business.staging.uevio.com
#   admin.staging.uevio.com

# ── staging.uevio.com (public web) ────────────────────────────────────────────
server {
    listen 80;
    server_name staging.uevio.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name staging.uevio.com;

    ssl_certificate     /etc/letsencrypt/live/staging.uevio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.uevio.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass         http://127.0.0.1:13002;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ── api.staging.uevio.com ─────────────────────────────────────────────────────
server {
    listen 80;
    server_name api.staging.uevio.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.staging.uevio.com;

    ssl_certificate     /etc/letsencrypt/live/api.staging.uevio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.staging.uevio.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50M;

    location / {
        proxy_pass         http://127.0.0.1:13001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

