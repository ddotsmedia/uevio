name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Get image tag
        id: tag
        run: echo "tag=sha-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /srv/uevio

            # Fetch latest compose file
            git fetch origin main
            git checkout origin/main -- \
              docker-compose.prod.yml \
              infrastructure/nginx/uevio.conf

            # Write .env
            cat > .env << 'ENVEOF'
            GITHUB_REPOSITORY_OWNER=${{ github.repository_owner }}
            IMAGE_TAG=${{ steps.tag.outputs.tag }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            REDIS_URL=${{ secrets.REDIS_URL }}
            REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
            API_SECRET_KEY=${{ secrets.API_SECRET_KEY }}
            R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }}
            R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}
            R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}
            R2_BUCKET_NAME=${{ secrets.R2_BUCKET_NAME }}
            R2_PUBLIC_URL=${{ secrets.R2_PUBLIC_URL }}
            SMTP_HOST=${{ secrets.SMTP_HOST }}
            SMTP_PORT=${{ secrets.SMTP_PORT }}
            SMTP_USER=${{ secrets.SMTP_USER }}
            SMTP_PASS=${{ secrets.SMTP_PASS }}
            SMTP_FROM=${{ secrets.SMTP_FROM }}
            NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}
            NEXTAUTH_URL_WEB=https://uevio.com
            NEXTAUTH_URL_BUSINESS=https://business.uevio.com
            NEXTAUTH_URL_ADMIN=https://admin.uevio.com
            API_URL=https://api.uevio.com
            NEXT_PUBLIC_WEB_URL=https://uevio.com
            ENVEOF

            # Login to GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull new images
            docker compose -f docker-compose.prod.yml pull api worker web business admin

            # Backup DB before migration
            docker compose -f docker-compose.prod.yml exec -T postgres \
              pg_dump -U ${{ secrets.POSTGRES_USER }} ${{ secrets.POSTGRES_DB }} \
              > /srv/uevio/backups/pre-deploy-$(date +%Y%m%d-%H%M%S).sql || true

            # Run migrations
            docker compose -f docker-compose.prod.yml run --rm \
              -e DATABASE_URL=${{ secrets.DATABASE_URL }} \
              api sh -c "npx prisma migrate deploy --schema packages/database/prisma/schema.prisma"

            # Rolling restart
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Health check
            sleep 20
            docker compose -f docker-compose.prod.yml ps --format "table {{.Name}}\t{{.Status}}"
            curl -sf http://127.0.0.1:13001/api/v1/health || echo "API health check failed — check logs"

      - name: Notify deployment
        if: always()
        run: |
          echo "Deploy ${{ job.status }} — tag: ${{ steps.tag.outputs.tag }}"
          echo "  https://uevio.com"
          echo "  https://api.uevio.com"
          echo "  https://business.uevio.com"
          echo "  https://admin.uevio.com"
