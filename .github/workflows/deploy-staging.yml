name: Deploy to Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Staging
    runs-on: ubuntu-latest
    environment: staging
    needs: []
    steps:
      - uses: actions/checkout@v4

      - name: Get image tag
        id: tag
        run: echo "tag=sha-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /srv/uevio

            # Pull latest compose file
            git fetch origin develop
            git checkout origin/develop -- docker-compose.staging.yml infrastructure/caddy/Caddyfile.staging

            # Set image tag
            export IMAGE_TAG=${{ steps.tag.outputs.tag }}
            export GITHUB_REPOSITORY_OWNER=${{ github.repository_owner }}

            # Pull new images
            docker compose -f docker-compose.staging.yml pull api worker web business admin

            # Run migrations
            docker compose -f docker-compose.staging.yml run --rm api \
              sh -c "cd packages/database && npx prisma migrate deploy"

            # Rolling restart (zero-downtime)
            docker compose -f docker-compose.staging.yml up -d --remove-orphans

            # Health check
            sleep 15
            docker compose -f docker-compose.staging.yml ps

      - name: Notify deployment
        if: always()
        run: |
          echo "Staging deployment ${{ job.status }} — tag: ${{ steps.tag.outputs.tag }}"
