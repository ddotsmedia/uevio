name: Deploy to Production

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag to deploy'
        required: true

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_VPS_HOST }}
          username: ${{ secrets.PROD_VPS_USER }}
          key: ${{ secrets.PROD_VPS_SSH_KEY }}
          script: |
            set -e
            cd /srv/uevio

            git fetch origin main
            git checkout origin/main -- docker-compose.prod.yml infrastructure/caddy/Caddyfile.prod

            export IMAGE_TAG=${{ steps.tag.outputs.tag }}
            export GITHUB_REPOSITORY_OWNER=${{ github.repository_owner }}

            # Pull images
            docker compose -f docker-compose.prod.yml pull api worker web business admin

            # Run migrations with backup
            docker compose -f docker-compose.prod.yml exec -T postgres \
              pg_dump -U $POSTGRES_USER $POSTGRES_DB > /srv/uevio/backups/pre-deploy-$(date +%Y%m%d-%H%M%S).sql

            docker compose -f docker-compose.prod.yml run --rm api \
              sh -c "cd packages/database && npx prisma migrate deploy"

            # Zero-downtime rolling restart
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            sleep 20
            docker compose -f docker-compose.prod.yml ps

      - name: Tag release
        run: echo "Production deploy complete — ${{ steps.tag.outputs.tag }}"
